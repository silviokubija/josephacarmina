<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Josephá Carmina — Em Breve</title>
<link rel="icon" type="image/jpeg" href="assets/imagens/Logo_simbolo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --bege: #F3EEE3; --verde-escuro: #3F4636; --dourado: #B89B5E; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Montserrat', sans-serif;
    background: var(--bege);
    color: var(--verde-escuro);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 20px;
  }
  .logo-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    margin-bottom: 40px;
  }
  .logo-container img.simbolo { height: 120px; width: auto; }
  .logo-container img.texto { height: 60px; width: auto; }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 500;
    margin-bottom: 16px;
  }
  h1 em { color: var(--dourado); font-style: italic; }
  p {
    font-size: 1.1rem;
    font-weight: 300;
    color: #6b6b60;
    max-width: 500px;
    line-height: 1.6;
  }
  .btn-admin {
    margin-top: 50px;
    font-size: 0.8rem;
    color: #a3a395;
    text-decoration: none;
    letter-spacing: 1px;
    transition: color 0.3s;
  }
  .btn-admin:hover { color: var(--verde-escuro); }
</style>
</head>
<body>

  <div class="logo-container">
    <img src="assets/imagens/Logo_simbolo.jpg" alt="Símbolo" class="simbolo">
    <img src="assets/imagens/Logo_texto.jpg" alt="Josephá Carmina" class="texto">
  </div>
  
  <h1>Estamos preparando <br><em>novidades incríveis</em></h1>
  <p>O acervo do Josephá Carmina está recebendo peças únicas. Nosso site retornará em breve com uma curadoria ainda mais especial.</p>

  <a href="admin.html" class="btn-admin">Acesso Restrito</a>

</body>
</html>
