<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Josephá Carmina</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --bege: #F3EEE3; --verde-escuro: #3F4636; --verde: #5E6751; --dourado: #B89B5E; }
  body { font-family: 'Montserrat', sans-serif; background: var(--bege); color: var(--verde-escuro); margin: 0; padding: 20px; }
  .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  h1, h2 { color: var(--verde-escuro); text-align: center; }
  .hidden { display: none !important; }
  .form-group { margin-bottom: 15px; }
  label { display: flex; justify-content: space-between; margin-bottom: 5px; font-weight: 500; font-size: 0.9rem; }
  .btn-add-cat { color: var(--dourado); cursor: pointer; font-weight: 600; font-size: 1.2rem; line-height: 1; }
  .btn-add-cat:hover { color: var(--verde-escuro); }
  input, select, button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; box-sizing: border-box; }
  button { background: var(--verde); color: #fff; border: none; cursor: pointer; font-weight: 600; margin-top: 10px; transition: 0.3s; }
  button:hover { background: var(--verde-escuro); }
  .btn-danger { background: #b34a3c; }
  .btn-danger:hover { background: #8a372c; }
  .btn-edit { background: #d0b06b; color: white; margin-right: 5px; }
  .btn-edit:hover { background: #B89B5E; }
  .btn-cancel { background: #999; margin-top: 5px; }
  .btn-cancel:hover { background: #666; }
  .logout-btn { background: #666; width: auto; padding: 5px 15px; float: right; margin-top: 0; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9rem; }
  th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
  th { background: var(--bege); }
  img.thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
  .msg { padding: 10px; margin-bottom: 15px; border-radius: 4px; text-align: center; display: none; }
  .msg.success { background: #d4edda; color: #155724; display: block; }
  .msg.error { background: #f8d7da; color: #721c24; display: block; }
  .action-buttons { display: flex; gap: 5px; }
  .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #ccc; }
  .tab { padding: 10px 20px; cursor: pointer; font-weight: 600; color: #999; }
  .tab.active { color: var(--verde-escuro); border-bottom: 3px solid var(--verde-escuro); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .mosaico-upload-row { display: flex; align-items: center; gap: 10px; }
</style>
</head>
<body>

<div class="container" id="loginBox">
  <h1>Login Administrativo</h1>
  <div id="loginMsg" class="msg"></div>
  <form id="loginForm">
    <div class="form-group">
      <label>E-mail</label>
      <input type="email" id="email" required>
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="password" required>
    </div>
    <button type="submit">Entrar</button>
  </form>
</div>

<div class="container hidden" id="adminBox">
  <button class="logout-btn" onclick="logout()">Sair</button>
  <h1>Painel Josephá Carmina</h1>
  
  <div class="tabs">
    <div class="tab active" onclick="switchTab('produtos', this)">Catálogo de Peças</div>
    <div class="tab" onclick="switchTab('mosaico', this)">Mosaico (Capa)</div>
  </div>
  
  <!-- === ABA PRODUTOS === -->
  <div id="tab-produtos" class="tab-content active">
    <h2 id="formTitle">Adicionar Nova Peça</h2>
    <div id="adminMsg" class="msg"></div>
    <form id="addForm">
    <input type="hidden" id="editId">
    <input type="hidden" id="oldImage">
    <div class="form-group">
      <label>Nome da Peça</label>
      <input type="text" id="nome" required>
    </div>
    <div class="form-group">
      <label>
        <span>Marca</span>
        <span class="btn-add-cat" onclick="adicionarNovaMarca()" title="Adicionar nova marca">+</span>
      </label>
      <select id="marca" required>
        <!-- Preenchido via JS -->
      </select>
    </div>
    <div class="form-group">
      <label>
        <span>Categoria</span>
        <span class="btn-add-cat" onclick="adicionarNovaCategoria()" title="Adicionar nova categoria">+</span>
      </label>
      <select id="categoria" required>
        <option value="Vestidos">Vestidos</option>
        <option value="Blusas">Blusas</option>
        <option value="Calças">Calças</option>
        <option value="Bolsas">Bolsas</option>
        <option value="Acessórios">Acessórios</option>
      </select>
    </div>
    <div class="form-group">
      <label>Tamanho</label>
      <input type="text" id="tamanho" required placeholder="Ex: M, 38, Único">
    </div>
    <div class="form-group">
      <label>Preço (R$)</label>
      <input type="number" step="0.01" id="preco" required placeholder="Ex: 89.90">
    </div>
    <div class="form-group">
      <label>Selo (Opcional)</label>
      <input type="text" id="selo" placeholder="Ex: Novidade, Peça Única">
    </div>
    <div class="form-group">
      <label id="fotoLabel">Foto da Peça</label>
      <input type="file" id="foto" accept="image/*" required>
    </div>
    <button type="submit" id="submitBtn">Salvar Peça</button>
    <button type="button" id="cancelBtn" class="btn-cancel hidden" onclick="cancelarEdicao()">Cancelar Edição</button>
  </form>

  <h2>Peças Cadastradas</h2>
  <table>
    <thead>
      <tr>
        <th>Foto</th>
        <th>Nome</th>
        <th>Marca</th>
        <th>Categoria</th>
        <th>Preço</th>
        <th>Ação</th>
      </tr>
    </thead>
    <tbody id="tabelaProdutos"></tbody>
  </table>
  </div> <!-- FIM ABA PRODUTOS -->
  
  <!-- === ABA MOSAICO === -->
  <div id="tab-mosaico" class="tab-content">
    <h2>Gerenciar Fotos da Capa</h2>
    <p style="text-align:center; font-size:0.9rem;">Estas são as 7 fotos que compõem o mosaico na página inicial.</p>
    <div id="mosaicoMsg" class="msg"></div>
    <table id="tabelaMosaico">
      <thead>
        <tr>
          <th>Posição</th>
          <th>Imagem Atual</th>
          <th>Nova Imagem</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody id="listaMosaico">
        <!-- Preenchido via JS -->
      </tbody>
    </table>
  </div> <!-- FIM ABA MOSAICO -->
  
</div>
<script>
  const SUPABASE_URL = 'https://qlfprztximxnmuycahcw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_DwtYsPo0iobWCtYRPxzxvg_ZFUVfnlG';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const loginBox = document.getElementById('loginBox');
  const adminBox = document.getElementById('adminBox');
  const loginMsg = document.getElementById('loginMsg');
  const adminMsg = document.getElementById('adminMsg');

  // Adicionar Nova Marca Manualmente
  async function adicionarNovaMarca() {
    const nova = prompt("Digite o nome da nova marca:");
    if (nova && nova.trim() !== "") {
      const marcaStr = nova.trim();
      const { error } = await supabaseClient.from('marcas').insert([{ nome: marcaStr }]);
      if (error) {
        alert("Erro ao adicionar marca (talvez ela já exista).");
      } else {
        await carregarMarcas(marcaStr);
      }
    }
  }

  // Carregar Marcas do banco
  async function carregarMarcas(selecionar = null) {
    const { data, error } = await supabaseClient.from('marcas').select('nome').order('nome');
    if (error) return;
    
    const select = document.getElementById('marca');
    const atual = selecionar || select.value;
    select.innerHTML = '';
    
    data.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.nome;
      opt.text = m.nome;
      select.add(opt);
    });
    
    if (atual && data.find(m => m.nome === atual)) {
      select.value = atual;
    }
  }

  // Adicionar Nova Categoria Manualmente
  function adicionarNovaCategoria() {
    const nova = prompt("Digite o nome da nova categoria:");
    if (nova && nova.trim() !== "") {
      const select = document.getElementById('categoria');
      const opt = document.createElement('option');
      opt.value = nova.trim();
      opt.text = nova.trim();
      select.add(opt);
      select.value = nova.trim();
    }
  }

  // Atualizar Dropdown com categorias do banco
  function popularCategoriasNoSelect(produtos) {
    const select = document.getElementById('categoria');
    const categoriasPadrao = ['Vestidos', 'Blusas', 'Calças', 'Bolsas', 'Acessórios'];
    const categoriasDoBanco = produtos.map(p => p.categoria);
    const todasCategorias = [...new Set([...categoriasPadrao, ...categoriasDoBanco])];
    
    const atual = select.value;
    select.innerHTML = '';
    todasCategorias.sort().forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.text = cat;
      select.add(opt);
    });
    if (todasCategorias.includes(atual)) {
      select.value = atual;
    }
  }

  // Checar sessão
  async function checkSession() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      loginBox.classList.add('hidden');
      adminBox.classList.remove('hidden');
      carregarMarcas();
      carregarTabela();
    } else {
      loginBox.classList.remove('hidden');
      adminBox.classList.add('hidden');
    }
  }

  // Login
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    loginMsg.className = 'msg';
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      loginMsg.textContent = 'Erro: ' + error.message;
      loginMsg.classList.add('error');
    } else {
      checkSession();
    }
  });

  // Logout
  async function logout() {
    await supabaseClient.auth.signOut();
    checkSession();
  }

  // Mostrar Mensagem Admin
  function showMsg(text, isError=false) {
    adminMsg.textContent = text;
    adminMsg.className = isError ? 'msg error' : 'msg success';
    setTimeout(() => adminMsg.className = 'msg', 4000);
  }

  // Cadastrar/Alterar Peça
  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Salvando...';

    try {
      const file = document.getElementById('foto').files[0];
      const editId = document.getElementById('editId').value;
      const oldImage = document.getElementById('oldImage').value;
      let finalImageUrl = oldImage;

      if (file) {
        const nomeArquivo = `${Date.now()}_${file.name}`;
        const { data: uploadData, error: uploadError } = await supabaseClient.storage
          .from('fotos')
          .upload(nomeArquivo, file);
        if (uploadError) throw uploadError;
        const { data: { publicUrl } } = supabaseClient.storage
          .from('fotos')
          .getPublicUrl(nomeArquivo);
        finalImageUrl = publicUrl;
      }

      const produto = {
        nome: document.getElementById('nome').value,
        marca: document.getElementById('marca').value,
        categoria: document.getElementById('categoria').value,
        tamanho: document.getElementById('tamanho').value,
        preco: parseFloat(document.getElementById('preco').value),
        selo: document.getElementById('selo').value,
        imagem: finalImageUrl
      };

      if (editId) {
        const { error: updateError } = await supabaseClient.from('produtos').update(produto).eq('id', editId);
        if (updateError) throw updateError;
        showMsg('Peça atualizada com sucesso!');
      } else {
        const { error: insertError } = await supabaseClient.from('produtos').insert([produto]);
        if (insertError) throw insertError;
        showMsg('Peça cadastrada com sucesso!');
      }

      cancelarEdicao(); 
      carregarTabela();

    } catch (err) {
      showMsg('Erro: ' + err.message, true);
    } finally {
      btn.disabled = false;
      const isEdit = document.getElementById('editId').value;
      btn.textContent = isEdit ? 'Atualizar Peça' : 'Salvar Peça';
    }
  });

  // Carregar Tabela
  async function carregarTabela() {
    const { data, error } = await supabaseClient.from('produtos').select('*').order('created_at', { ascending: false });
    const tbody = document.getElementById('tabelaProdutos');
    if (error) {
      tbody.innerHTML = '<tr><td colspan="6">Erro ao carregar</td></tr>';
      return;
    }
    
    // Atualiza o select de categorias dinamicamente
    popularCategoriasNoSelect(data);
    
    tbody.innerHTML = data.map(p => `
      <tr>
        <td><img src="${p.imagem}" class="thumb"></td>
        <td>${p.nome}</td>
        <td>${p.marca || '-'}</td>
        <td>${p.categoria}</td>
        <td>R$ ${p.preco.toFixed(2).replace('.',',')}</td>
        <td class="action-buttons">
          <button class="btn-edit" onclick="iniciarEdicao('${p.id}', '${p.nome.replace(/'/g, "\\'")}', '${p.marca ? p.marca.replace(/'/g, "\\'") : ''}', '${p.categoria}', '${p.tamanho}', ${p.preco}, '${p.selo || ''}', '${p.imagem}')">Alterar</button>
          <button class="btn-danger" onclick="excluir(${p.id})">Excluir</button>
        </td>
      </tr>
    `).join('');
  }

  // Iniciar Edição
  function iniciarEdicao(id, nome, marca, categoria, tamanho, preco, selo, imagem) {
    document.getElementById('formTitle').textContent = 'Alterar Peça';
    document.getElementById('editId').value = id;
    document.getElementById('oldImage').value = imagem;
    
    document.getElementById('nome').value = nome;
    document.getElementById('tamanho').value = tamanho;
    document.getElementById('preco').value = preco;
    document.getElementById('selo').value = selo;
    
    const selectMarca = document.getElementById('marca');
    if (marca) {
      let marcaExists = Array.from(selectMarca.options).some(opt => opt.value === marca);
      if(!marcaExists) {
        const opt = document.createElement('option');
        opt.value = marca;
        opt.text = marca;
        selectMarca.add(opt);
      }
      selectMarca.value = marca;
    }
    
    const selectCat = document.getElementById('categoria');
    let catExists = Array.from(selectCat.options).some(opt => opt.value === categoria);
    if(!catExists) {
      const opt = document.createElement('option');
      opt.value = categoria;
      opt.text = categoria;
      selectCat.add(opt);
    }
    selectCat.value = categoria;
    
    const fotoInput = document.getElementById('foto');
    fotoInput.required = false;
    document.getElementById('fotoLabel').textContent = 'Foto da Peça (Deixe em branco para manter a atual)';
    
    document.getElementById('submitBtn').textContent = 'Atualizar Peça';
    document.getElementById('cancelBtn').classList.remove('hidden');
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Cancelar Edição
  function cancelarEdicao() {
    document.getElementById('addForm').reset();
    document.getElementById('formTitle').textContent = 'Adicionar Nova Peça';
    document.getElementById('editId').value = '';
    document.getElementById('oldImage').value = '';
    
    document.getElementById('foto').required = true;
    document.getElementById('fotoLabel').textContent = 'Foto da Peça';
    
    document.getElementById('submitBtn').textContent = 'Salvar Peça';
    document.getElementById('cancelBtn').classList.add('hidden');
  }

  // Excluir Peça
  async function excluir(id) {
    if(confirm('Tem certeza que deseja excluir esta peça?')) {
      const { error } = await supabaseClient.from('produtos').delete().eq('id', id);
      if (error) {
        showMsg('Erro ao excluir', true);
      } else {
        showMsg('Peça excluída.');
        carregarTabela();
      }
    }
  }

  checkSession();

  // ===== TABS =====
  function switchTab(tabId, element) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    element.classList.add('active');
    document.getElementById('tab-' + tabId).classList.add('active');
    if(tabId === 'mosaico') carregarMosaico();
  }

  // ===== MOSAICO =====
  async function carregarMosaico() {
    const { data, error } = await supabaseClient.from('mosaico').select('*').order('posicao', { ascending: true });
    if(error) { console.error(error); return; }
    
    const tbody = document.getElementById('listaMosaico');
    tbody.innerHTML = '';
    
    const posicoes = [1,2,3,4,5,6,7];
    posicoes.forEach(pos => {
      const item = data.find(d => d.posicao === pos) || { posicao: pos, url_imagem: '' };
      
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${item.posicao} ${item.posicao === 5 ? '(Centro Grande)' : ''}</td>
        <td>
          ${item.url_imagem ? `<img src="${item.url_imagem}" class="thumb">` : 'Vazio'}
        </td>
        <td>
          <input type="file" id="file-mosaico-${item.posicao}" accept="image/*">
        </td>
        <td>
          <button class="btn-edit" onclick="salvarFotoMosaico(${item.posicao})">Salvar</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function salvarFotoMosaico(pos) {
    const fileInput = document.getElementById('file-mosaico-' + pos);
    const file = fileInput.files[0];
    const msgDiv = document.getElementById('mosaicoMsg');
    
    if(!file) {
      msgDiv.className = 'msg error';
      msgDiv.innerText = 'Por favor, selecione uma imagem primeiro!';
      setTimeout(() => msgDiv.style.display = 'none', 3000);
      return;
    }

    msgDiv.className = 'msg';
    msgDiv.style.display = 'block';
    msgDiv.style.color = '#333';
    msgDiv.innerText = 'Fazendo upload da imagem...';

    const fileExt = file.name.split('.').pop();
    const fileName = `mosaico_${pos}_${Date.now()}.${fileExt}`;
    
    const { data: uploadData, error: uploadError } = await supabaseClient
      .storage
      .from('fotos')
      .upload(fileName, file);

    if (uploadError) {
      msgDiv.className = 'msg error';
      msgDiv.innerText = 'Erro ao enviar foto: ' + uploadError.message;
      return;
    }

    const { data: publicUrlData } = supabaseClient.storage.from('fotos').getPublicUrl(fileName);
    const imageUrl = publicUrlData.publicUrl;

    const { error: dbError } = await supabaseClient
      .from('mosaico')
      .upsert({ posicao: pos, url_imagem: imageUrl }, { onConflict: 'posicao' });

    if(dbError) {
      msgDiv.className = 'msg error';
      msgDiv.innerText = 'Erro ao salvar no banco: ' + dbError.message;
      return;
    }

    msgDiv.className = 'msg success';
    msgDiv.innerText = 'Foto da posição ' + pos + ' atualizada com sucesso!';
    fileInput.value = '';
    carregarMosaico();
    setTimeout(() => msgDiv.style.display = 'none', 3000);
  }
</script>
</body>
</html>
